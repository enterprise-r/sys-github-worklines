name: Assign
description: Assign an issue or pull request opened with no assignee.
inputs:
  assignee:
    description: Login to assign. Empty means the default.
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ASSIGNEE: ${{ inputs.assignee || 'neg3ntropy' }}
        NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      run: >-
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/assignees"
        -f "assignees[]=$ASSIGNEE" --silent
