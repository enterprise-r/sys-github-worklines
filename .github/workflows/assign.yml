name: Assign

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    if: ${{ !(github.event.issue || github.event.pull_request).assignees[0] }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: enterprise-r/_skel/assign@main
        with:
          assignee: ${{ vars.ASSIGNEE }}
